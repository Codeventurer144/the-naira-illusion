name: Site QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        run: |
          node --check js/app.js
          node --check js/simulator.js

      - name: Start local site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/naira-server.log 2>&1 &
          echo $! > /tmp/naira-server.pid
          sleep 2
          curl --fail http://127.0.0.1:8000/index.html >/dev/null
          curl --fail http://127.0.0.1:8000/data/naira_illusion_monthly.csv >/dev/null

      - name: Render dashboard in headless Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=12000             --dump-dom http://127.0.0.1:8000/ > /tmp/default-dom.html

          grep -q "1,503,654" /tmp/default-dom.html
          test "$(grep -o "<svg" /tmp/default-dom.html | wc -l)" -ge 3
          grep -q "Got it — let me try" /tmp/default-dom.html
          ! grep -q "onboarding-x" /tmp/default-dom.html

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=12000             --dump-dom "http://127.0.0.1:8000/?balance=2000000&start=2020-01&end=2024-01&strategy=savings"             > /tmp/changed-dom.html

          grep -q "2,000,000" /tmp/changed-dom.html
          grep -q "overview-explanation" /tmp/changed-dom.html
          ! grep -q 'id="metric-nominal">—<' /tmp/changed-dom.html

          "$CHROME" --headless=new --no-sandbox --disable-gpu             --window-size=1440,1000             --screenshot=site-qa.png             http://127.0.0.1:8000/

      - name: Static interaction checks
        run: |
          grep -q 'data-page-target="overview"' index.html
          grep -q 'data-page-target="simulator"' index.html
          grep -q 'data-page-target="history"' index.html
          grep -q 'data-page-target="pain"' index.html
          grep -q 'data-page-target="methodology"' index.html
          grep -q 'onclick="document.getElementById('''onboarding''').hidden=true' index.html
          test "$(grep -c 'class="panel method-section"' index.html)" -eq 7
          grep -q 'function switchPage(page)' js/app.js
          grep -q 'function runExperiment' js/app.js
          grep -q 'function renderPainRanking' js/app.js

      - name: Upload QA screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-qa-screenshot
          path: site-qa.png
          if-no-files-found: ignore
