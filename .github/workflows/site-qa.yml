name: Site QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        run: |
          node --check js/app.js
          node --check js/simulator.js

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/naira-server.log 2>&1 &
          echo $! > /tmp/naira-server.pid
          sleep 2
          curl --fail http://127.0.0.1:8000/index.html >/dev/null
          curl --fail http://127.0.0.1:8000/data/naira_illusion_monthly.csv >/dev/null

      - name: Browser test
        run: |
          cat > /tmp/site-qa.cjs <<'EOF'
          const { chromium } = require('playwright');
          const assert = require('assert');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];

            page.on('pageerror', error => pageErrors.push(error.message));

            const response = await page.goto('http://127.0.0.1:8000/', {
              waitUntil: 'networkidle',
              timeout: 60000
            });

            assert(response && response.ok(), 'Homepage did not load successfully.');
            assert(await page.evaluate(() => !!window.d3), 'D3 did not load.');

            await page.waitForFunction(() => {
              const value = document.querySelector('#metric-nominal')?.textContent?.trim();
              return value && value !== '—';
            }, { timeout: 20000 });

            const defaultMetric = await page.locator('#metric-nominal').innerText();
            assert(defaultMetric.includes('1,503,654'), 'Default nominal result is not populated correctly.');

            assert.strictEqual(await page.locator('#overview-wealth-chart svg').count(), 1, 'Overview chart did not render.');
            assert.strictEqual(await page.locator('#inflation-rate-chart svg').count(), 1, 'Inflation chart did not render.');
            assert.strictEqual(await page.locator('#retained-chart svg').count(), 1, 'Purchasing-power chart did not render.');

            const guide = page.locator('#onboarding');
            assert(await guide.isVisible(), 'Guide should be visible on initial load.');
            await page.locator('#onboarding-close').click();
            await page.waitForFunction(() => document.querySelector('#onboarding')?.hidden === true);
            assert(!(await guide.isVisible()), 'Guide did not close.');

            await page.locator('[data-page-target="simulator"]').click();
            await page.waitForSelector('[data-page="simulator"].active');
            await page.waitForFunction(() => document.querySelectorAll('#simulator-wealth-chart svg').length === 1);

            await page.locator('[data-page-target="history"]').click();
            await page.waitForSelector('[data-page="history"].active');
            await page.waitForFunction(() => document.querySelectorAll('#return-strip svg').length === 1);
            await page.waitForFunction(() => document.querySelectorAll('#rolling-return-chart svg').length === 1);

            await page.locator('[data-page-target="pain"]').click();
            await page.waitForSelector('[data-page="pain"].active');
            assert.strictEqual(await page.locator('#pain-ranking .pain-row').count(), 5, 'Loss-period ranking did not render five rows.');

            await page.locator('[data-page-target="methodology"]').click();
            await page.waitForSelector('[data-page="methodology"].active');
            assert.strictEqual(await page.locator('.method-section').count(), 7, 'Methodology sections are incomplete.');

            await page.locator('[data-page-target="overview"]').click();
            await page.locator('#starting-balance').fill('2000000');
            await page.locator('#start-date').selectOption('2020-01');
            await page.locator('#end-date').selectOption('2024-01');
            await page.locator('#experiment-form .run-button').click();

            await page.waitForFunction(() => {
              const input = document.querySelector('#starting-balance');
              const chip = document.querySelector('#scenario-chip');
              return input?.value === '2,000,000' && chip?.textContent?.includes('2,000,000');
            });

            const changedMetric = await page.locator('#metric-nominal').innerText();
            assert(changedMetric && changedMetric !== '—', 'Updated simulation did not populate.');

            const explanation = await page.locator('#overview-explanation').innerText();
            assert(explanation.includes('₦2,000,000') || explanation.includes('NGN'), 'Dynamic explanation did not update.');

            await page.screenshot({ path: 'site-qa.png', fullPage: true });

            if (pageErrors.length) {
              throw new Error('Browser page errors: ' + pageErrors.join(' | '));
            }

            console.log('QA PASSED');
            console.log('Default metric:', defaultMetric);
            console.log('Updated metric:', changedMetric);
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF
          node /tmp/site-qa.cjs

      - name: Upload QA screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-qa-screenshot
          path: site-qa.png
          if-no-files-found: ignore
